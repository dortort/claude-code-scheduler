name: Release

on:
  release:
    types: [published]

defaults:
  run:
    working-directory: plugins/scheduler

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'scheduler--v')
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/scheduler/npm-shrinkwrap.json
          registry-url: https://registry.npmjs.org
      - run: node ../../scripts/marketplace.mjs check
      - run: npm run check-version
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG !== `scheduler--v${version}`) {
              throw new Error(`Release tag must be scheduler--v${version}`);
            }
          '
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
      - run: npm publish --access public
      - name: Show marketplace promotion command
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `npm publication submitted. Once the package is downloadable, promote it from the repository root:\n\nnode scripts/marketplace.mjs promote scheduler ${version}\n\nTest the catalog PR with node scripts/check-marketplace-install.mjs before merging.\n`);
          JS
