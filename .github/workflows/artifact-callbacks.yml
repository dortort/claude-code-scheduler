name: Artifact Callbacks

on:
  push:
    branches: [main]
    paths:
      - 'plugins/artifact-callbacks*/**'
      - '.claude-plugin/marketplace.json'
      - 'README.md'
      - '.github/workflows/artifact-callbacks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/artifact-callbacks*/**'
      - '.claude-plugin/marketplace.json'
      - 'README.md'
      - '.github/workflows/artifact-callbacks.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: plugins/artifact-callbacks
    shell: bash

permissions:
  contents: read

concurrency:
  group: artifact-callbacks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (node sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install dev dependencies
        run: npm ci
      # The hooks module's tsc check needs .claude-plugin/types, which only a session
      # loading the mod writes; the plugin job checks that module with validate and test.
      - name: Typecheck
        run: npm run typecheck:node

  node:
    name: Node tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22.18.0', '24']
    steps:
      - name: Keep LF line endings on Windows
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Node version
        run: node --version
      - name: Unit tests
        run: npm run test:unit
      - name: Conformance
        run: npm run test:conformance

  browser:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install Playwright
        # Dev-time only: the plugin ships no node_modules, so nothing is saved to package.json.
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Install Claude Code and tmux for the real-session test
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo apt-get install -y tmux
      - name: Real-session end-to-end (skips, saying why, without model access)
        run: npm run test:e2e

  channel:
    name: Channel adapter (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/artifact-callbacks-channel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dev dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: MCP, supervision and sidecar drift tests
        run: npm run test:unit

  channel-browser:
    name: Channel adapter browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/artifact-callbacks-channel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser

  plugin:
    name: Claude plugin validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate the plugins
        run: |
          for dir in plugins/artifact-callbacks*/; do
            if [ -f "$dir.claude-plugin/plugin.json" ]; then
              echo "::group::claude plugin validate $dir"
              claude plugin validate "$dir"
              echo "::endgroup::"
            fi
          done
      - name: Hooks module tests
        run: |
          for dir in plugins/artifact-callbacks*/; do
            if compgen -G "$dir"'hooks/*.test.ts*' > /dev/null; then
              echo "::group::claude plugin test $dir"
              claude plugin test "$dir"
              echo "::endgroup::"
            fi
          done

  docs:
    name: Docs tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: README, SKILL.md, manifest and CI checks
        run: npm run test:docs
